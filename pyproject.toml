[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system1-browser"
version = "0.2.0"
description = "Ultra-fast, Sub-10ms Local System-1 Orchestration Framework for AI Web Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gustavo Guelber", email = "contato@intelflows.com.br" }
]
keywords = ["system-1", "browser-automation", "agents", "cdp", "chrome-devtools", "mcp", "fast-navigation", "julia", "eikos"]
dependencies = [
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "requests>=2.28.0",
    "torch",
    "transformers",
    "fastmcp>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
system1-browser = "system1_browser.cli:main"
